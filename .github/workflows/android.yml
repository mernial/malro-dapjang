name: 말로 답장 앱 빌드

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

# 두 브랜치가 동시에 플레이에 올리면 충돌하므로 빌드를 한 번에 하나씩
concurrency:
  group: talk-helper-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 플레이 콘솔 '서비스 계정 키'(JSON). 등록돼 있으면 내부 테스트에 자동 업로드
      PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 버전 번호 = 실행 번호 + 100
      # (예전 catholic-shorts 저장소에서 1.84 까지 올렸으므로, 플레이가 받아 주도록 더 큰 번호에서 시작)
      - name: 버전 번호 정하기
        run: echo "APP_VERSION=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
      - name: 단위 테스트
        run: ./gradlew --no-daemon testGithubDebugUnitTest
      # GitHub 비밀에 서명 키가 있으면 꺼내 씀 (없으면 매번 다른 임시 키 → 앱 안 업데이트 불가)
      - name: 서명 키 준비
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY_B64 }}
        run: |
          if [ -n "$SIGNING_KEY_B64" ]; then
            echo "$SIGNING_KEY_B64" | base64 -d > "$RUNNER_TEMP/talkhelper.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/talkhelper.jks" >> "$GITHUB_ENV"
            echo "고정 서명 키 사용"
          else
            echo "::warning::SIGNING_KEY_B64 비밀이 없어 임시 키로 서명합니다. 앱 안 업데이트가 되지 않습니다."
          fi
      # github: 직접 설치용 APK / play: 플레이 스토어 업로드용 AAB
      - name: APK·AAB 만들기
        run: ./gradlew --no-daemon assembleGithubDebug bundlePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: talk-helper-apk
          path: android/app/build/outputs/apk/github/debug/app-github-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: talk-helper-play-aab
          path: android/app/build/outputs/bundle/playRelease/app-play-release.aab
      # 휴대폰에서 바로 받을 수 있는 고정 주소:
      # https://github.com/<저장소>/releases/download/talk-helper/talk-helper.apk
      - name: 설치 파일 올리기 (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/github/debug/app-github-debug.apk talk-helper.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab talk-helper-play.aab
          # 앱이 새 버전을 확인하는 파일
          # 직접 설치판은 배포 중단(2026-11-10): 예전 앱의 '새 버전' 띠에 옮기기 안내가 보이게
          NOTES="이제 플레이 스토어판으로 옮겨요. 업데이트한 뒤 화면의 안내를 따라 주세요."
          SIGNED=$([ -n "$SIGNING_STORE_FILE" ] && echo true || echo false)
          python3 -c 'import json,sys; print(json.dumps({"versionCode": int(sys.argv[1]), "versionName": "1."+sys.argv[1], "notes": sys.argv[2][:120], "signed": sys.argv[3]=="true"}, ensure_ascii=False))' \
            "$APP_VERSION" "$NOTES" "$SIGNED" > version.json
          cat version.json
          if ! gh release view talk-helper --repo "$REPO" >/dev/null 2>&1; then
            gh release create talk-helper --repo "$REPO" --target "$GITHUB_SHA" \
              --title "말로 답장 (직접 설치판 배포 중단)" \
              --notes "직접 설치판은 배포를 멈췄습니다. 플레이 스토어의 '말로 답장'을 설치하세요."
          fi
          # GitHub 서버가 잠깐 오류(500/502)를 내는 일이 있어 최대 4번 다시 시도
          upload() { for n in 1 2 3 4; do gh release upload talk-helper "$@" --repo "$REPO" --clobber && return 0; echo "올리기 실패 ($n/4), 20초 뒤 다시"; sleep 20; done; return 1; }
          upload talk-helper.apk version.json
          # 플레이 콘솔에 올릴 파일 (업로드 키로 서명된 경우만)
          if [ -n "$SIGNING_STORE_FILE" ]; then upload talk-helper-play.aab; fi
      # 서비스 계정 키가 등록돼 있고 고정 서명 키로 만든 경우에만, 플레이 내부 테스트에 자동으로 올림
      # (첫 버전은 플레이 콘솔에서 직접 올려야 함)
      # 휴대폰·태블릿에서 키 내용을 복사하면 줄바꿈이 섞여 JSON 이 깨질 수 있어 정리해서 파일로 씀
      - name: 플레이 서비스 계정 키 정리
        if: ${{ env.PLAY_JSON != '' && env.SIGNING_STORE_FILE != '' }}
        run: |
          python3 - <<'PY'
          import json, os
          raw = os.environ["PLAY_JSON"].strip()
          data = json.loads(raw, strict=False)  # 문자열 안의 실제 줄바꿈도 허용
          path = os.path.join(os.environ["RUNNER_TEMP"], "play-service-account.json")
          with open(path, "w") as f:
              json.dump(data, f)
          print("서비스 계정:", data.get("client_email"))
          PY
      - name: 플레이 내부 테스트에 자동 업로드
        if: ${{ env.PLAY_JSON != '' && env.SIGNING_STORE_FILE != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: kr.yunho.talkhelper
          releaseFiles: android/app/build/outputs/bundle/playRelease/app-play-release.aab
          # 코드 이름을 숨겼으므로, 플레이 오류 기록을 읽을 수 있게 짝표(mapping)도 올림
          mappingFile: android/app/build/outputs/mapping/playRelease/mapping.txt
          track: internal
          status: completed
      # main 에 합친 버전은 비공개 테스트(가족 테스터)에도 올림 → 구글 검토 뒤 테스터 폰에 자동 업데이트
      - name: 비공개 테스트에도 올리기 (main 만)
        if: ${{ github.ref == 'refs/heads/main' && env.PLAY_JSON != '' && env.SIGNING_STORE_FILE != '' }}
        working-directory: .
        run: |
          pip install -q google-auth requests
          SA_PATH="$RUNNER_TEMP/play-service-account.json" python3 .github/play/promote.py
