name: 앱 죽음 확인 (에뮬레이터)

on:
  push:
    branches: ['claude/**']
    paths: ['android/**', '.github/capture/crash.sh', '.github/workflows/crash-check.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: 앱 만들기 (플레이판 릴리스, 코드 숨김 켠 그대로 · 시험 신호만 켬)
        working-directory: android
        env:
          E2E: "1"
        run: ./gradlew --no-daemon assemblePlayRelease
      - name: AI 지시문이 앱에 없는지 확인
        run: |
          APK=android/app/build/outputs/apk/play/release/app-play-release.apk
          ls -la "$APK"
          n=$(unzip -p "$APK" 'classes*.dex' | grep -ac "카카오톡 답장을 대신" || true)
          echo "지시문 흔적: $n"
          [ "$n" = "0" ]
      - name: KVM 켜기
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 카드 열어 보기
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: timeout 900 bash .github/capture/crash.sh || true
      - name: 화면 사진을 ui-shots 브랜치에 올리기
        if: always()
        run: |
          ls shots || exit 0
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ui-shots
          git rm -rq --cached . || true
          git add -f shots
          git commit -qm "화면 사진 $(date -u +%F)"
          git push -f origin ui-shots
