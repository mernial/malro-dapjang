<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
 body{margin:0;font-family:'Noto Sans KR',sans-serif}
 #icon{width:512px;height:512px;background:#2E7D6B;display:flex;align-items:center;justify-content:center;position:relative}
 #feature{width:1024px;height:500px;background:#F3F7F5;display:flex;align-items:center;padding:0 70px;box-sizing:border-box;gap:56px;color:#1F3D35}
 .t1{font-size:74px;font-weight:900;line-height:1.15;letter-spacing:-2px}
 .t2{font-size:30px;font-weight:700;margin-top:18px;color:#6B5D52;line-height:1.4}
 .pill{display:inline-block;background:#2E7D6B;color:#fff;border-radius:30px;padding:6px 22px;font-size:26px;font-weight:900;margin-bottom:16px}
 .chips{display:flex;gap:10px;margin-top:22px}
 .chip{background:#fff;border:3px solid #CFE3DC;border-radius:24px;padding:6px 18px;font-size:24px;font-weight:700}
</style></head><body>
<div id="icon">
  <svg width="400" height="400" viewBox="0 0 108 108">
    <path fill="#FFFFFF" d="M54,22C35.2,22 20,34 20,48.8c0,9.5 6.3,17.9 15.8,22.6l-3.5,12c-0.3,1.1 0.9,1.9 1.8,1.3l14.3,-9.5c1.9,0.2 3.8,0.4 5.6,0.4c18.8,0 34,-12 34,-26.8S72.8,22 54,22z"/>
    <rect x="38" y="39" width="32" height="6" rx="3" fill="#2E7D6B"/>
    <rect x="38" y="51" width="22" height="6" rx="3" fill="#2E7D6B"/>
    <circle cx="80" cy="74" r="15" fill="#E53935"/>
    <rect x="76.5" y="64" width="7" height="13" rx="3.5" fill="#fff"/>
    <path d="M72,73 a8,8 0 0 0 16,0" stroke="#fff" stroke-width="2.4" fill="none"/>
    <rect x="79" y="81" width="2" height="4" fill="#fff"/>
  </svg>
</div>
<div style="height:30px"></div>
<div id="feature">
  <svg width="300" height="300" viewBox="0 0 108 108" style="flex:none;background:#2E7D6B;border-radius:64px">
    <path fill="#FFFFFF" d="M54,22C35.2,22 20,34 20,48.8c0,9.5 6.3,17.9 15.8,22.6l-3.5,12c-0.3,1.1 0.9,1.9 1.8,1.3l14.3,-9.5c1.9,0.2 3.8,0.4 5.6,0.4c18.8,0 34,-12 34,-26.8S72.8,22 54,22z"/>
    <rect x="38" y="39" width="32" height="6" rx="3" fill="#2E7D6B"/>
    <rect x="38" y="51" width="22" height="6" rx="3" fill="#2E7D6B"/>
    <circle cx="80" cy="74" r="15" fill="#E53935"/>
    <rect x="76.5" y="64" width="7" height="13" rx="3.5" fill="#fff"/>
    <path d="M72,73 a8,8 0 0 0 16,0" stroke="#fff" stroke-width="2.4" fill="none"/>
    <rect x="79" y="81" width="2" height="4" fill="#fff"/>
  </svg>
  <div>
    <div class="pill">말로 답장</div>
    <div class="t1">말하면 예쁘게<br>바꿔서 보내 줘요</div>
    <div class="t2">자판이 어려운 분도 버튼 하나로</div>
    <div class="chips"><span class="chip">정중하게</span><span class="chip">친구처럼</span><span class="chip">업무 연락</span></div>
  </div>
</div>
</body></html>
